<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>おにぎりカーナビ 追尾切替・安定版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:sans-serif;overflow:hidden;}
#map{height:100vh; display:none;}
#panelTop, #panelBottom{display:none;}
#panelTop{position:fixed; top:0; left:0; right:0; background:white; box-shadow:0 4px 10px rgba(0,0,0,0.3); z-index:1000; width:100%; font-size:14px; text-align:center; transition:all 0.5s ease; border-radius:24px;}
#panelTop.opening{height:150px;padding:20px;}
#panelTop.nav{height:auto;padding:10px; width:90%; max-width:400px; margin:0 auto; border-radius:24px;}
#panelTop input, #panelTop button{display:none;}
#panelBottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:white;padding:8px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.3);z-index:1000;width:95%;max-width:600px;font-size:14px;}
#loader{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:2000;font-size:16px;}
#spinner{width:80px; height:80px; position:relative; margin:0 auto; transform-origin:center center; animation:spin 1.5s linear infinite;}
.dot{width:10px; height:10px; background:deepskyblue; border-radius:50%; position:absolute; top:50%; left:50%; margin:-5px 0 0 -5px;}
.dot:nth-child(1){transform:rotate(0deg) translate(35px);}
.dot:nth-child(2){transform:rotate(40deg) translate(35px);}
.dot:nth-child(3){transform:rotate(80deg) translate(35px);}
.dot:nth-child(4){transform:rotate(120deg) translate(35px);}
.dot:nth-child(5){transform:rotate(160deg) translate(35px);}
.dot:nth-child(6){transform:rotate(200deg) translate(35px);}
.dot:nth-child(7){transform:rotate(240deg) translate(35px);}
.dot:nth-child(8){transform:rotate(280deg) translate(35px);}
.dot:nth-child(9){transform:rotate(320deg) translate(35px);}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.leaflet-control-zoom { display: none !important; }

/* 追加：「現在地に戻る」ボタンのスタイル */
#recenterBtn {
  display: none;
  position: fixed;
  bottom: 70px;
  right: 15px;
  background: white;
  color: deepskyblue;
  border: 2px solid deepskyblue;
  border-radius: 8px;
  padding: 10px 15px;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 1000;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="loader">
  <div id="spinner">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div>Now Loading…</div>
</div>

<div id="panelTop" class="opening">
  <input id="address" placeholder="目的地住所">
  <button onclick="searchAddress()">検索</button>
  <button onclick="startNav()">ナビ開始</button>
  <button id="endNavBtn" onclick="endNav()" style="display:none;">ルート終了</button>
  <div id="turnInfo">曲がり角案内</div>
</div>

<div id="panelBottom">
  <div id="info">残り距離・到着時間</div>
</div>

<button id="recenterBtn" onclick="recenterMap()">現在地に戻る</button>

<div id="map"></div>

<script>
let map,currentLatLng=null,currentMarker=null;
let destination=null,destinationMarker=null,destinationCircle=null;
let routeLine=null,routeData=null,steps=[];
let navStarted=false,mode='driving';
let arrivalDistance=20; 

// 追加：状態を管理するフラグ
let isTracking = true;       // 自動追尾するかどうか
let firstLocationFound = false; // 最初の1回現在地を取得したかどうか

// 変更：初期表示を日本全体にしておく（真っ白になるエラーを防ぐため）
map=L.map('map').setView([36.2048, 138.2529], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

// 追加：地図をドラッグしたら自動追尾をオフにする
map.on('dragstart', function() {
    isTracking = false; // 追尾をストップ
    if (currentLatLng) {
        document.getElementById("recenterBtn").style.display = 'block'; // ボタンを表示
    }
});

// 追加：「現在地に戻る」ボタンの機能
function recenterMap() {
    isTracking = true; // 追尾を再開
    document.getElementById("recenterBtn").style.display = 'none'; // ボタンを隠す
    if (currentLatLng) {
        map.setView(currentLatLng, navStarted ? 16 : 14); // ナビ中はズーム、そうでない時は少し引いて表示
    }
}

// GPS取得
function initGPS(){
  if("geolocation" in navigator){
    navigator.geolocation.watchPosition(pos=>{
      currentLatLng=[pos.coords.latitude,pos.coords.longitude];
      
      // 最初の1回だけ、強制的に現在地へ移動する
      if(!firstLocationFound) {
          map.setView(currentLatLng, 14);
          firstLocationFound = true;
      }
      
      updateCurrentMarker();
      if(navStarted) checkArrival(); 
    },err=>{
        alert("GPS取得エラー: "+err.message);
    },{enableHighAccuracy:true,maximumAge:0});
  } else alert("ブラウザが位置情報に対応していません");
}

// GPSマーカー更新
function updateCurrentMarker(){
  if(currentLatLng){
    if(!currentMarker) currentMarker=L.circleMarker(currentLatLng,{radius:8,color:"deepskyblue",fillColor:"deepskyblue",fillOpacity:0.5}).addTo(map);
    else currentMarker.setLatLng(currentLatLng);
    
    // 変更：ナビ開始中 かつ 自動追尾(isTracking)がONの時だけ画面を動かす
    if(navStarted && isTracking) {
        map.setView(currentLatLng, 16); 
    }
  }
}

// 目的地設定
function setDestination(latlng){if(navStarted) return; destination=latlng;
if(destinationMarker) map.removeLayer(destinationMarker); if(destinationCircle) map.removeLayer(destinationCircle);
destinationMarker=L.marker(destination).addTo(map); destinationCircle=L.circle(destination,{radius:arrivalDistance,color:'red',fill:false}).addTo(map);
if(routeLine){ map.removeLayer(routeLine); routeLine=null; routeData=null; steps=[]; }

// 目的地を設定したら追尾を一時的にオフにする（目的地周辺を見やすくするため）
isTracking = false;
document.getElementById("recenterBtn").style.display = 'block';
map.setView(destination,14);

document.getElementById("turnInfo").innerText="曲がり角案内"; document.getElementById("info").innerText="残り距離・到着時間";
}

// 検索
function searchAddress(){if(navStarted) return;
const addr=document.getElementById("address").value;
fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=jp&q=${encodeURIComponent(addr)}`).then(r=>r.json())
.then(data=>{if(data.length>0) setDestination([parseFloat(data[0].lat),parseFloat(data[0].lon)]);});
}

// クリックで設定
map.on('click',function(e){if(navStarted) return; setDestination([e.latlng.lat,e.latlng.lng]);});

// ナビ開始
function startNav(){
if(!currentLatLng||!destination){alert("現在地と目的地を設定してください"); return;}
navStarted=true; 
isTracking=true; // ナビ開始時は追尾をONにする
document.getElementById("recenterBtn").style.display='none';
document.getElementById("endNavBtn").style.display='inline-block';
map.setView(currentLatLng,16); 
let profile='driving';
let url=`https://router.project-osrm.org/route/v1/${profile}/${currentLatLng[1]},${currentLatLng[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson&steps=true&alternatives=true`;
fetch(url).then(r=>r.json()).then(data=>{
if(!data.routes || data.routes.length==0) return;
let shortest=data.routes.reduce((min,rt)=>rt.distance<min.distance?rt:min,data.routes[0]);
routeData=shortest; drawRoute(routeData);
});
}

// ルート描画
function drawRoute(route){if(routeLine) map.removeLayer(routeLine);
const coords=route.geometry.coordinates.map(c=>[c[1],c[0]]);
routeLine=L.polyline(coords,{color:"blue",weight:6}).addTo(map);
steps=[];
route.legs[0].steps.forEach(s=>{
let instr=""; switch(s.maneuver.type){
case "turn": instr=(s.maneuver.modifier==="left")?"左に曲がる":(s.maneuver.modifier==="right")?"右に曲がる":"曲がる"; break;
case "uturn": instr="Uターン"; break;
case "depart": instr="直進"; break;
case "roundabout": instr="ロータリー"; break;
default: instr="直進";}
steps.push({latlng:[s.maneuver.location[1],s.maneuver.location[0]],instruction:instr,distance:s.distance});
});
updateTurnInfo(); updateInfo();}

// ナビ終了
function endNav(){navStarted=false; document.getElementById("endNavBtn").style.display='none';
isTracking=true; document.getElementById("recenterBtn").style.display='none';
if(routeLine){ map.removeLayer(routeLine); routeLine=null; routeData=null; steps=[]; }
document.getElementById("turnInfo").innerText="曲がり角案内"; document.getElementById("info").innerText="残り距離・到着時間";}

// 到着判定
function checkArrival(){
if(!currentLatLng || !destination) return;
let d=map.distance(currentLatLng,destination);
if(d<=arrivalDistance){
endNav();
document.getElementById("turnInfo").innerText="目的地に到着！";
}
}

// 曲がり角案内
function updateTurnInfo(){if(!currentLatLng||steps.length===0){document.getElementById("turnInfo").innerText="曲がり角案内"; return;}
for(let i=0;i<steps.length;i++){let d=map.distance(currentLatLng,steps[i].latlng); if(d>5){document.getElementById("turnInfo").innerText=`次の曲がり角まで ${Math.round(d)} m → ${steps[i].instruction}`; break;}}}

// 残距離計算
function updateInfo(){if(!currentLatLng||!routeData) return;
const coords=routeData.geometry.coordinates; let minDist=Infinity,nearestIndex=0;
coords.forEach((c,i)=>{let latlng=[c[1],c[0]]; let d=map.distance(currentLatLng,latlng); if(d<minDist){minDist=d;nearestIndex=i;}});
let dist=0; for(let i=nearestIndex;i<coords.length-1;i++) dist+=map.distance([coords[i][1],coords[i][0]],[coords[i+1][1],coords[i+1][0]]);
let speedKmh=40; let timeH=dist/1000/speedKmh; let hours=Math.floor(timeH); let minutes=Math.round((timeH-hours)*60);
document.getElementById("info").innerText=`残り ${(dist/1000).toFixed(2)} km | 到着まで あと ${hours}時間 ${minutes}分`;
if(routeLine){
const past=coords.slice(0,nearestIndex+1).map(c=>[c[1],c[0]]);
const future=coords.slice(nearestIndex).map(c=>[c[1],c[0]]);
map.removeLayer(routeLine);
L.polyline(past,{color:"gray",weight:6}).addTo(map);
routeLine=L.polyline(future,{color:"blue",weight:6}).addTo(map);}}

setInterval(()=>{if(navStarted){updateTurnInfo();updateInfo();checkArrival();}},1000);

// 初期GPS開始
initGPS();

// ローダー消す
window.onload=function(){
  setTimeout(()=>{
    document.getElementById('loader').style.display='none';
    document.getElementById('map').style.display='block';
    map.invalidateSize();
    document.getElementById('panelTop').classList.remove('opening');
    document.getElementById('panelTop').classList.add('nav');
    document.querySelectorAll('#panelTop input,#panelTop button').forEach(e=>e.style.display='inline-block');
    document.getElementById('panelTop').style.display='block';
    document.getElementById('panelBottom').style.display='block';
  },500);
}
</script>
</body>
</html>
